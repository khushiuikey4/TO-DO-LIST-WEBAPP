<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List Web App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+NO:wght@100..400&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="mainContainer">
        <div class="header">
            <div class="mainLogo">
            </div>
            <div class="mainTitle">TO DO LIST&hearts;</div>
        </div>
        <div class="listContainer">
            <div class="punchLine">“Clarity in every checkmark.”</div>

            <div class="card">
                <div class="taskInp">
                    <input class="taskField" placeholder="Add a task. . ." type="text" name="task" id="task">
                    <label for="task" class="taskLabel"></label>
                    <button class="taskAdder">+</button>
                </div>

                <div class="tasklistContainer">
                    <div class="tasklist">

                        <!-- <div class="addedTask">
                            <div class="checkBoxContainer">
                                <input class="checkbox" type="checkbox" name="completion" id="mark">
                                <label for="mark"></label>
                                <button class="remove">X</button>
                            </div>
                            <div class="taskLog">
                            </div>
                        </div> -->

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
